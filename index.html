<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaar Tycoon</title>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --buy: #059669; --sell: #e11d48; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .btn { border: none; padding: 10px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; margin-bottom: 10px; background: #0f172a; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bazaar Tycoon</h1>
    
    <div class="card">
        <h3>🏆 Oyun Bitti! Skorunu Kaydet</h3>
        <input type="text" id="playerName" placeholder="Adını Gir">
        <button class="btn" style="background:#059669" onclick="saveScore()">Skoru Veritabanına Kaydet</button>
    </div>
    
    <div class="card">
        <h3>🥇 Liderlik Tablosu</h3>
        <div id="leaderboard">Yükleniyor...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ZocVE8OyDbVSwE668zpgxeUJH1CLIsU",
        authDomain: "bazaartycoon-e8fad.firebaseapp.com",
        projectId: "bazaartycoon-e8fad",
        databaseURL: "https://bazaartycoon-e8fad-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "bazaartycoon-e8fad.firebasestorage.app",
        messagingSenderId: "666398131808",
        appId: "1:666398131808:web:1702dba9df2af2793e2505"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Skor Kaydetme Fonksiyonu
    window.saveScore = function() {
        const name = document.getElementById('playerName').value || "Anonim";
        const score = 15000; // Örnek skor, bunu oyunun bitişindeki değişkenle değiştirebilirsin
        push(ref(db, 'scores'), { name: name, score: score, timestamp: Date.now() });
        alert("Başarıyla kaydedildi!");
    };

    // Liderlik Tablosunu Otomatik Güncelleme
    const scoresRef = query(ref(db, 'scores'), orderByChild('score'), limitToLast(5));
    onValue(scoresRef, (snapshot) => {
        const data = snapshot.val();
        let html = "";
        if (data) {
            Object.values(data).reverse().forEach(entry => {
                html += `<p>${entry.name}: <b>$${entry.score.toLocaleString()}</b></p>`;
            });
        } else {
            html = "Henüz kayıt yok.";
        }
        document.getElementById('leaderboard').innerHTML = html;
    });
</script>
</body>
</html>
