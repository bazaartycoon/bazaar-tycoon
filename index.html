<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bazaar Tycoon Pro</title>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --btn: #4f46e5; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 550px; margin: 0 auto; }
        .market-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .price-range { font-size: 0.8rem; color: #94a3b8; }
        /* Butonun tıklanabilir olması için stil */
        .btn-toggle { 
            width: 100%; padding: 15px; margin-top: 15px; 
            background: #475569; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-weight: bold; 
            display: block; text-align: center;
        }
        .btn-toggle:hover { background: #64748b; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 8px; background: #0f172a; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bazaar Tycoon</h1>
        <div id="marketTable"></div>
        <div class="save-section">
            <h3>🥇 Global Leaderboard</h3>
            <div id="leaderboard"><em>Loading...</em></div>
            <button class="btn-toggle" onclick="window.toggleLeaderboard()">Show/Hide All (Top 100)</button>
        </div>
    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
    
    const db = getDatabase(initializeApp({ apiKey: "AIzaSyD7ZocVE8OyDbVSwE668zpgxeUJH1CLIsU", databaseURL: "https://bazaartycoon-e8fad-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bazaartycoon-e8fad" }));
    
    let allScores = [];
    let showAll = false;

    // Fonksiyonu window nesnesine açıkça bağladım
    window.toggleLeaderboard = () => { 
        showAll = !showAll; 
        renderLeaderboard(); 
    };

    function renderLeaderboard() {
        const board = document.getElementById('leaderboard');
        board.innerHTML = "";
        let limit = showAll ? 100 : 5;
        allScores.slice(0, limit).forEach(s => {
            board.innerHTML += `<div class="leaderboard-item"><span>${s.name}</span> <b>$${s.score.toLocaleString()}</b></div>`;
        });
    }

    onValue(ref(db, 'scores'), (s) => { 
        allScores = []; 
        s.forEach(c => allScores.push(c.val())); 
        allScores.sort((a,b) => b.score - a.score); 
        renderLeaderboard(); 
    });
</script>
</body>
</html>
