<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bazaar Tycoon</title>
    <style>
        :root { 
            --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; 
            --text: #f1f5f9; --buy: #059669; --sell: #e11d48; --btn: #4f46e5;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--accent); font-size: 1.8rem; letter-spacing: 1px; }
        
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }

        .market-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .market-row { background: var(--card); border-radius: 8px; }
        td { padding: 12px; }
        .price-main { display: block; font-weight: bold; }
        .price-range { font-size: 0.65rem; color: #64748b; }
        
        .btn { border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-buy { background: var(--buy); width: 100%; margin-bottom: 4px; }
        .btn-sell { background: var(--sell); width: 100%; }
        .btn-main { background: var(--btn); width: 100%; padding: 15px; margin-top: 10px; }

        select { background: #334155; color: white; border: none; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>Bazaar Tycoon</h1></div>
    
    <div class="stats">
        <div class="stat-card"><span class="stat-label">Day</span><span id="lblDay" class="stat-val">1/30</span></div>
        <div class="stat-card"><span class="stat-label">Cash</span><span id="lblCash" class="stat-val">$10,000</span></div>
    </div>

    <table class="market-table" id="marketTable"></table>

    <button class="btn btn-main" onclick="nextDay()">Next Day ➔</button>
</div>

<script>
    let gameState = { day: 1, cash: 10000, products: { 
        coffee: { name: "☕", price: 100, min: 50, max: 250, qty: 0 }, 
        gadgets: { name: "💻", price: 1200, min: 600, max: 2500, qty: 0 } 
    } };

    function updateUI() {
        document.getElementById('lblDay').innerText = `${gameState.day}/30`;
        document.getElementById('lblCash').innerText = `$${gameState.cash.toLocaleString()}`;
        let html = '';
        for (let k in gameState.products) {
            let p = gameState.products[k];
            html += `<tr class="market-row">
                <td style="font-size:1.5rem">${p.name}</td>
                <td><span class="price-main">$${p.price}</span><span class="price-range">${p.min}-${p.max}</span></td>
                <td>${p.qty}</td>
                <td><button class="btn btn-buy" onclick="buy('${k}')">Buy</button><button class="btn btn-sell" onclick="sell('${k}')">Sell</button></td>
            </tr>`;
        }
        document.getElementById('marketTable').innerHTML = html;
    }
    // ... diğer fonksiyonlar (buy, sell, nextDay) aynı kalabilir
    updateUI();
</script>
</body>
</html>
