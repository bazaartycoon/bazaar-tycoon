<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bazaar Tycoon - Tam Ölçekli Sürüm</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-color: #1e293b;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --button-blue: #4f46e5;
            --button-orange: #f59e0b;
            --button-cyan: #0891b2;
            --button-danger: #e11d48;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-panel {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            text-align: center;
        }

        .market-item {
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            pointer-events: auto !important;
            font-size: 1rem;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .leaderboard-section {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #334155;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #0f172a;
            margin-top: 5px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bazaar Tycoon</h1>

    <div class="stats-panel">
        <div>Cash: $<span id="display-cash">10,000</span></div>
        <div>Storage: <span id="display-storage">0/100</span></div>
        <div>Day: <span id="display-day">1/30</span></div>
    </div>

    <div id="market-table">
        </div>

    <button class="action-button" style="background-color: var(--button-orange);" onclick="upgradeStorageAction()">
        📦 Upgrade Storage (-$1,000, +10 Space)
    </button>

    <button class="action-button" style="background-color: var(--button-blue);" onclick="nextDayAction()">
        Next Day ➔
    </button>

    <button class="action-button" style="background-color: var(--button-cyan);" onclick="watchAdAction()">
        📺 Watch Ad for +$1,000
    </button>

    <div class="leaderboard-section">
        <h3>🥇 Global Leaderboard</h3>
        <div id="leaderboard-list">
            <em>Yükleniyor...</em>
        </div>
        <button id="toggle-leaderboard-btn" class="action-button" style="background-color: #475569;" onclick="toggleLeaderboardView()">
            Show/Hide All (Top 100)
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ZocVE8OyDbVSwE668zpgxeUJH1CLIsU",
        databaseURL: "https://bazaartycoon-e8fad-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bazaartycoon-e8fad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Oyun durumu değişkenleri
    window.gameState = {
        cash: 10000,
        storage: 0,
        maxStorage: 100,
        day: 1,
        showAllScores: false
    };

    let globalScores = [];

    // Fonksiyon tanımlamaları (window nesnesine doğrudan atandı)
    window.upgradeStorageAction = function() {
        if (window.gameState.cash >= 1000) {
            window.gameState.cash -= 1000;
            window.gameState.maxStorage += 10;
            updateUIElements();
        } else {
            alert("Yetersiz bakiye!");
        }
    };

    window.watchAdAction = function() {
        window.gameState.cash += 1000;
        updateUIElements();
    };

    window.nextDayAction = function() {
        if (window.gameState.day < 30) {
            window.gameState.day += 1;
            updateUIElements();
        } else {
            alert("Oyun bitti!");
        }
    };

    window.toggleLeaderboardView = function() {
        window.gameState.showAllScores = !window.gameState.showAllScores;
        renderLeaderboardUI();
    };

    function renderLeaderboardUI() {
        const listContainer = document.getElementById('leaderboard-list');
        listContainer.innerHTML = "";
        
        const limit = window.gameState.showAllScores ? 100 : 3;
        
        globalScores.slice(0, limit).forEach(function(entry) {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'leaderboard-entry';
            entryDiv.innerHTML = '<span>' + entry.name + '</span> <b>$' + entry.score.toLocaleString() + '</b>';
            listContainer.appendChild(entryDiv);
        });
    }

    function updateUIElements() {
        document.getElementById('display-cash').innerText = window.gameState.cash.toLocaleString();
        document.getElementById('display-storage').innerText = window.gameState.storage + "/" + window.gameState.maxStorage;
        document.getElementById('display-day').innerText = window.gameState.day + "/30";
    }

    // Firebase veri dinleyici
    onValue(ref(db, 'scores'), function(snapshot) {
        globalScores = [];
        snapshot.forEach(function(childSnapshot) {
            globalScores.push(childSnapshot.val());
        });
        
        globalScores.sort(function(a, b) {
            return b.score - a.score;
        });
        
        renderLeaderboardUI();
    });

    // Başlangıç tetikleyicisi
    updateUIElements();
</script>

</body>
</html>
