<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bazaar Tycoon</title>
    <style>
        * { box-sizing: border-box; }
        :root { --bg-color: #0f172a; --card-color: #1e293b; --text-color: #f8fafc; --accent-color: #38bdf8; --buy-color: #10b981; --sell-color: #ef4444; --ad-color: #8b5cf6; --upgrade-color: #f59e0b; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; background-color: var(--card-color); padding: 20px; border-radius: 16px; }
        
        /* Başlık alanı renklendirmesi */
        .header-box { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            padding: 15px; 
            border-radius: 10px; 
            border: 2px solid var(--accent-color); 
            margin-bottom: 20px; 
            text-align: center;
        }
        h1 { margin: 0; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background-color: #0f172a; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); display: block; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; color: #e2e8f0; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #334155; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; color: white; }
        .btn-buy { background-color: var(--buy-color); font-size: 0.8rem; padding: 6px 12px; }
        .btn-sell { background-color: var(--sell-color); font-size: 0.8rem; padding: 6px 12px; }
        .btn-action { background-color: var(--accent-color); color: #0f172a; }
        .btn-ad { background-color: var(--ad-color); }
        .btn-upgrade { background-color: var(--upgrade-color); }
        .module-box { padding: 15px; border: 1px solid #334155; border-radius: 10px; margin-top: 15px; background: #0f172a; }
        select { padding: 8px; width: 100%; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 6px; margin-bottom: 10px; }
        .ad-footer { margin-top: 30px; text-align: center; min-height: 90px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>Bazaar Tycoon</h1>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">Day <span id="lblDay" class="stat-val">1/30</span></div>
        <div class="stat-card">Cash <span id="lblCash" class="stat-val">$10.000</span></div>
        <div class="stat-card">Debt <span id="lblDebt" class="stat-val" style="color:var(--sell-color)">$0</span></div>
        <div class="stat-card">Stock <span id="lblStorage" class="stat-val">0/20</span></div>
    </div>

    <div class="table-wrapper"><table id="marketTable"></table></div>

    <button class="btn btn-action" onclick="nextDay()">Advance to Next Day ➔</button>
    <button class="btn btn-upgrade" onclick="upgradeStorage()">📦 Upgrade Storage (Cost: $5,000)</button>
    <button id="adBtn" class="btn btn-ad" onclick="watchAd()">🎥 Watch Ad & Earn $2,000</button>

    <div class="module-box">
        <h3>🏦 Banking</h3>
        <select id="bankAmount"><option value="1000">$1,000</option><option value="5000">$5,000</option></select>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-action" onclick="takeLoan()" style="flex:1">Borrow</button>
            <button class="btn btn-sell" onclick="repayLoan()" style="flex:1">Repay</button>
        </div>
    </div>
</div>

<div class="ad-footer">
    <script type="text/javascript">
        atOptions = {
            'key' : '6cb28deb56ed227ba08751f4c06e73e8',
            'format' : 'standard',
            'height' : 90,
            'width' : 728,
            'params' : {}
        };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/6cb28deb56ed227ba08751f4c06e73e8/invoke.js"></script>
</div>

<script>
    let gameState = { day: 1, cash: 10000, debt: 0, currentStorage: 0, maxStorage: 20, 
    products: { coffee: { name: "☕", price: 100, qty: 0 }, spices: { name: "🌶️", price: 50, qty: 0 }, fabric: { name: "🧵", price: 300, qty: 0 }, gadgets: { name: "💻", price: 1200, qty: 0 } } };

    function upgradeStorage() { if(gameState.cash >= 5000) { gameState.cash -= 5000; gameState.maxStorage += 10; updateUI(); } else { alert("Not enough cash!"); } }
    function updateUI() {
        document.getElementById('lblDay').innerText = `${gameState.day}/30`;
        document.getElementById('lblCash').innerText = `$${gameState.cash.toLocaleString()}`;
        document.getElementById('lblDebt').innerText = `$${gameState.debt.toLocaleString()}`;
        document.getElementById('lblStorage').innerText = `${gameState.currentStorage}/${gameState.maxStorage}`;
        let html = '<tr><th>P</th><th>Price</th><th>Qty</th><th>Amt</th><th>Action</th></tr>';
        for (let k in gameState.products) {
            let p = gameState.products[k];
            html += `<tr><td>${p.name}</td><td>$${p.price}</td><td>${p.qty}</td>
            <td><select id="amt_${k}" style="width:45px;"><option value="1">1</option><option value="5">5</option><option value="max">M</option></select></td>
            <td><button class="btn btn-buy" onclick="buy('${k}')">Buy</button> <button class="btn btn-sell" onclick="sell('${k}')">Sell</button></td></tr>`;
        }
        document.getElementById('marketTable').innerHTML = html;
    }
    function watchAd() { window.open('https://www.effectivecpmnetwork.com/qa0r2bb1a?key=086e2069ca27730d6b652050880ae41b', '_blank'); gameState.cash += 2000; updateUI(); }
    function buy(k) { let p = gameState.products[k]; let val = document.getElementById('amt_'+k).value; let amt = (val === 'max') ? (gameState.maxStorage - gameState.currentStorage) : parseInt(val); if (amt > 0 && gameState.cash >= p.price * amt && gameState.currentStorage + amt <= gameState.maxStorage) { gameState.cash -= p.price * amt; p.qty += amt; gameState.currentStorage += amt; updateUI(); } }
    function sell(k) { let p = gameState.products[k]; let val = document.getElementById('amt_'+k).value; let amt = (val === 'max') ? p.qty : parseInt(val); if (amt > 0 && p.qty >= amt) { gameState.cash += p.price * amt; p.qty -= amt; gameState.currentStorage -= amt; updateUI(); } }
    function takeLoan() { let amt = parseInt(document.getElementById('bankAmount').value); if (gameState.debt + amt <= 15000) { gameState.cash += amt; gameState.debt += amt; updateUI(); } }
    function repayLoan() { let amt = parseInt(document.getElementById('bankAmount').value); if(gameState.cash >= amt) { gameState.cash -= amt; gameState.debt -= amt; updateUI(); } }
    function nextDay() { gameState.day++; for (let k in gameState.products) { gameState.products[k].price = Math.round(gameState.products[k].price * (0.8 + Math.random() * 0.4)); } updateUI(); }
    updateUI();
</script>
</body>
</html>
