<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bazaar Tycoon Pro</title>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: block; }
        .btn:active { transform: scale(0.98); }
        .save-section { background: var(--card); padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #334155; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 10px; background: #0f172a; margin-top: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bazaar Tycoon</h1>
        <div id="stats" style="margin-bottom:20px;">
            Cash: $<span id="lblCash">10,000</span> | Storage: <span id="lblStorage">0/100</span>
        </div>
        
        <button class="btn" style="background:#f59e0b" onclick="upgradeStorage()">📦 Upgrade Storage (-$1000, +10 Space)</button>
        <button class="btn" style="background:#4f46e5" onclick="nextDay()">Next Day ➔</button>
        <button class="btn" style="background:#0891b2" onclick="watchAd()">📺 Watch Ad for +$1000</button>

        <div class="save-section">
            <h3>🥇 Global Leaderboard</h3>
            <div id="leaderboard"><em>Yükleniyor...</em></div>
            <button id="toggleBtn" class="btn" style="background:#475569;">Show/Hide All (Top 100)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const db = getDatabase(initializeApp({ apiKey: "AIzaSyD7ZocVE8OyDbVSwE668zpgxeUJH1CLIsU", databaseURL: "https://bazaartycoon-e8fad-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bazaartycoon-e8fad" }));

        window.gameState = { cash: 10000, storage: 0, maxStorage: 100, day: 1 };
        let allScores = [];
        let showAll = false;

        window.upgradeStorage = () => { if(window.gameState.cash >= 1000) { window.gameState.cash -= 1000; window.gameState.maxStorage += 10; updateUI(); } else { alert("Yetersiz bakiye!"); } };
        window.watchAd = () => { window.gameState.cash += 1000; updateUI(); };
        window.nextDay = () => { window.gameState.day++; updateUI(); };
        window.toggleLeaderboard = () => { showAll = !showAll; renderLeaderboard(); };

        function renderLeaderboard() {
            const board = document.getElementById('leaderboard');
            board.innerHTML = "";
            let limit = showAll ? 100 : 3;
            allScores.slice(0, limit).forEach(s => {
                board.innerHTML += `<div class="leaderboard-item"><span>${s.name}</span> <b>$${s.score.toLocaleString()}</b></div>`;
            });
        }

        function updateUI() {
            document.getElementById('lblCash').innerText = window.gameState.cash.toLocaleString();
            document.getElementById('lblStorage').innerText = `${window.gameState.storage}/${window.gameState.maxStorage}`;
        }

        document.getElementById('toggleBtn').onclick = window.toggleLeaderboard;
        onValue(ref(db, 'scores'), (s) => {
            allScores = [];
            s.forEach(c => allScores.push(c.val()));
            allScores.sort((a, b) => b.score - a.score);
            renderLeaderboard();
        });
        updateUI();
    </script>
</body>
</html>
