<!DOCTYPE html>
<html lang="tr"><head><title>Bazaar Tycoon</title>
<style>
  body{background:#0b1120;color:#f1f5f9;font-family:sans-serif;padding:20px;max-width:500px;margin:auto}
  .btn{width:100%;padding:15px;margin:5px 0;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer}
  .btn:active{transform:scale(0.98)}
  .lb-item{display:flex;justify-content:space-between;padding:8px;background:#0f172a;margin-top:5px}
</style></head><body>
<h1>Bazaar Tycoon</h1><p>Cash: $<span id="c">10000</span> | Storage: <span id="s">0/100</span></p>
<button class="btn" style="background:#f59e0b" onclick="up()">📦 Upgrade Storage (-$1000, +10)</button>
<button class="btn" style="background:#4f46e5" onclick="nxt()">Next Day ➔</button>
<button class="btn" style="background:#0891b2" onclick="ad()">📺 Watch Ad +$1000</button>
<div style="background:#1e293b;padding:15px;margin-top:20px"><h3>🥇 Leaderboard</h3><div id="lst"></div>
<button id="tgl" class="btn" style="background:#475569">Show/Hide All (Top 100)</button></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
  const db = getDatabase(initializeApp({apiKey:"AIzaSyD7ZocVE8OyDbVSwE668zpgxeUJH1CLIsU",databaseURL:"https://bazaartycoon-e8fad-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"bazaartycoon-e8fad"}));
  let st = {c:10000, s:0, m:100, d:1, sh:false}, sc = [];
  window.up = () => { if(st.c>=1000){st.c-=1000; st.m+=10; ui();} else alert("Yetersiz!"); };
  window.ad = () => { st.c+=1000; ui(); };
  window.nxt = () => { st.d++; ui(); };
  document.getElementById('tgl').onclick = () => { st.sh=!st.sh; ren(); };
  function ren() {
    let l = document.getElementById('lst'); l.innerHTML = "";
    sc.slice(0, st.sh ? 100 : 3).forEach(v => l.innerHTML += `<div class="lb-item"><span>${v.name}</span><b>$${v.score.toLocaleString()}</b></div>`);
  }
  function ui() { document.getElementById('c').innerText = st.c.toLocaleString(); document.getElementById('s').innerText = `${st.s}/${st.m}`; }
  onValue(ref(db, 'scores'), (s) => {
    sc = []; s.forEach(c => sc.push(c.val())); sc.sort((a,b) => b.score - a.score); ren();
  });
  ui();
</script></body></html>
