<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaar Tycoon</title>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --buy: #059669; --sell: #e11d48; --btn: #4f46e5; --upgrade: #f59e0b; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .header { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: center; border: 1px solid #334155; }
        .header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: var(--card); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #334155; font-size: 0.9rem; }
        .stat-val { display: block; font-size: 1.1rem; font-weight: bold; color: var(--accent); }

        .market-item { background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 8px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .qty-selector { display: flex; gap: 5px; justify-content: center; }
        
        .btn { border: none; padding: 8px; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-qty { background: #475569; }
        .btn-buy { background: var(--buy); flex: 1; }
        .btn-sell { background: var(--sell); flex: 1; }
        .btn-full { width: 100%; padding: 12px; margin-top: 5px; font-weight: bold; }

        .input-group { background: var(--card); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; }
        .banner { background: #1e293b; padding: 10px; text-align: center; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>Bazaar Tycoon</h1></div>
    
    <div class="stats">
        <div class="stat-card">Day <span id="lblDay" class="stat-val">1/30</span></div>
        <div class="stat-card">Cash <span id="lblCash" class="stat-val">$10,000</span></div>
        <div class="stat-card">Debt <span id="lblDebt" class="stat-val">$25,000</span></div>
        <div class="stat-card">Storage <span id="lblStorage" class="stat-val">0/100</span></div>
    </div>

    <div id="marketTable"></div>

    <button class="btn btn-full" style="background:var(--btn);" onclick="nextDay()">Next Day ➔</button>
    <button class="btn btn-full" style="background:var(--upgrade);" onclick="alert('Warehouse Upgrade!')">📦 Warehouse Upgrade</button>
    <button class="btn btn-full" style="background:var(--accent);" onclick="watchAd()">📺 Watch Ad (+$1000)</button>

    <div class="input-group">
        <h3>🏆 Save Score</h3>
        <input type="text" id="playerName" placeholder="Name">
        <button class="btn btn-buy" style="width:100%;" onclick="saveScore()">Save Score</button>
    </div>

    <div class="input-group">
        <h3>🥇 Leaderboard</h3>
        <div id="leaderboard" style="font-size: 0.9rem;">Loading...</div>
    </div>

    <div class="banner">© 2026 Bazaar Tycoon - All Rights Reserved</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const gameState = { day: 1, cash: 10000, debt: 25000, storage: 0, maxStorage: 100, buyQty: 1, products: { 
        coffee: { name: "☕ Coffee", price: 50, qty: 0 }, textiles: { name: "👕 Textiles", price: 200, qty: 0 },
        gadgets: { name: "💻 Gadgets", price: 800, qty: 0 }, electronics: { name: "📱 Electronics", price: 2500, qty: 0 }
    }};

    const db = getDatabase(initializeApp({ apiKey: "AIzaSyD7ZocVE8OyDbVSwE668zpgxeUJH1CLIsU", databaseURL: "https://bazaartycoon-e8fad-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bazaartycoon-e8fad" }));

    let savedName = localStorage.getItem("tycoon_name") || "Trader_" + Math.floor(Math.random() * 10000);
    localStorage.setItem("tycoon_name", savedName);
    document.getElementById('playerName').value = savedName;

    window.watchAd = () => { gameState.cash += 1000; updateUI(); alert("+$1000 earned!"); }
    window.nextDay = () => { gameState.day++; Object.values(gameState.products).forEach(p => p.price = Math.floor(Math.random() * 500) + 50); updateUI(); };
    window.saveScore = () => { push(ref(db, 'scores'), { name: document.getElementById('playerName').value, score: gameState.cash }); alert("Saved!"); };
    window.setQty = (n) => { gameState.buyQty = n; updateUI(); };

    function updateUI() {
        document.getElementById('lblDay').innerText = `${gameState.day}/30`;
        document.getElementById('lblCash').innerText = `$${gameState.cash.toLocaleString()}`;
        document.getElementById('lblDebt').innerText = `$${gameState.debt.toLocaleString()}`;
        document.getElementById('lblStorage').innerText = `${gameState.storage}/${gameState.maxStorage}`;
        
        let html = "";
        for(let k in gameState.products) {
            let p = gameState.products[k];
            html += `<div class="market-item">
                <div class="item-row"><strong>${p.name} ($${p.price})</strong> <span>Owned: ${p.qty}</span></div>
                <div class="qty-selector">
                    <button class="btn btn-qty" onclick="setQty(1)">1</button>
                    <button class="btn btn-qty" onclick="setQty(5)">5</button>
                    <button class="btn btn-qty" onclick="setQty(10)">10</button>
                    <button class="btn btn-qty" onclick="setQty(999)">MAX</button>
                </div>
                <div class="item-row" style="margin-top:8px">
                    <button class="btn btn-buy" onclick="buy('${k}')">Buy ${gameState.buyQty}</button>
                    <button class="btn btn-sell" onclick="sell('${k}')">Sell ${gameState.buyQty}</button>
                </div>
            </div>`;
        }
        document.getElementById('marketTable').innerHTML = html;
    }

    window.buy = (k) => { let cost = gameState.products[k].price * gameState.buyQty; if(gameState.cash >= cost) { gameState.cash -= cost; gameState.products[k].qty += gameState.buyQty; gameState.storage += gameState.buyQty; updateUI(); } };
    window.sell = (k) => { if(gameState.products[k].qty >= gameState.buyQty) { gameState.cash += gameState.products[k].price * gameState.buyQty; gameState.products[k].qty -= gameState.buyQty; gameState.storage -= gameState.buyQty; updateUI(); } };

    onValue(query(ref(db, 'scores'), orderByChild('score'), limitToLast(5)), (s) => {
        let html = ""; s.forEach(c => html += `<p>${c.val().name}: $${c.val().score.toLocaleString()}</p>`);
        document.getElementById('leaderboard').innerHTML = html;
    });

    updateUI();
</script>
</body>
</html>
